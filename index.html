<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لا تنسَ">
<title>لا تنسَ — ذاكرة البيت</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="appHeader">
  <h1>لا تنسَ</h1>
  <div style="display:flex;gap:8px;">
    <button id="btnPulse" class="header-btn" aria-label="نبض البيت">💚</button>
    <button id="btnSettings" class="header-btn" aria-label="إعدادات">⚙️</button>
  </div>
</header>

<main id="appMain">
  <section id="scr-home" class="screen active">
    <div id="forgetBanner" class="forget-banner hidden"></div>
    <div id="seasonalBanner" class="tip-card hidden" style="border-right-color:var(--gold);"></div>
    <div id="dailyTip"></div>
    <div class="now-header">الآن — <span id="nowTime"></span></div>
    <div id="liveTasks"></div>
    <div class="quick-cards" id="quickCards"></div>
    <button class="btn-add" data-add="task">＋ أضف مهمة</button>
  </section>

  <section id="scr-journal" class="screen">
    <h2>🫀 أثر البيت</h2>
    <div id="journalContent"></div>
  </section>

  <section id="scr-appointments" class="screen">
    <h2>📅 المواعيد والتذكيرات</h2>
    <div id="appointmentsList"></div>
    <div class="quick-cards" style="margin-top:20px;">
      <button class="quick-card" onclick="UI.openAddAppointment('medication')">
        <span class="qc-icon">💊</span> إضافة دواء
      </button>
      <button class="quick-card" onclick="UI.openAddAppointment('birthday')">
        <span class="qc-icon">🎂</span> عيد ميلاد
      </button>
      <button class="quick-card" onclick="UI.openAddAppointment('anniversary')">
        <span class="qc-icon">💍</span> ذكرى زواج
      </button>
    </div>
  </section>

  <section id="scr-family" class="screen">
    <h2>👨‍👩‍👧‍👦 عائلتك اليوم</h2>
    <p class="hint">نظرة سريعة لمن يحتاجك الآن.</p>
    <div id="familyWheel"></div>
  </section>

  <section id="scr-forgotten" class="screen">
    <h2>🫥 المنسي</h2>
    <div class="quick-row">
      <input id="forgetInput" placeholder="ماذا لا تريد أن تنساه؟">
      <button id="btnForget" class="btn-primary">احفظ</button>
    </div>
    <div id="forgottenList"></div>
  </section>

  <section id="scr-couple" class="screen">
    <h2>💞 الزوجان</h2>
    <div id="coupleList"></div>
  </section>

  <section id="scr-kids" class="screen">
    <h2>👨‍👩‍👧‍👦 الأطفال</h2>
    <div id="kidsList"></div>
    <button class="btn-add" data-add="child">＋ طفل جديد</button>
  </section>

  <section id="scr-parenting" class="screen">
    <h2>📚 نصائح تربوية</h2>
    <div id="parentingContent"></div>
  </section>

  <section id="scr-worship" class="screen">
    <h2>🕌 العبادة</h2>
    <div id="prayerSection"></div>
    <div id="adhkarSection"></div>
  </section>

  <section id="scr-routine" class="screen">
    <h2>⏰ الروتين اليومي</h2>
    <div id="routineContent"></div>
    <button class="btn-add" data-add="routine">＋ إضافة فترة</button>
  </section>

  <section id="scr-mirror" class="screen">
    <h2>📖 المرآة الأسبوعية</h2>
    <div id="mirrorContent"></div>
  </section>

  <section id="scr-settings" class="screen">
    <h2>⚙️ الإعدادات</h2>
    <div id="settingsContent"></div>
  </section>
</main>

<nav id="bottomNav">
  <button data-screen="home">🏠<span>الآن</span></button>
  <button data-screen="appointments">📅<span>المواعيد</span></button>
  <button data-screen="family">👨‍👩‍👧<span>العائلة</span></button>
  <button data-screen="forgotten">🫥<span>المنسي</span></button>
  <button data-screen="kids">👦<span>الأطفال</span></button>
  <button data-screen="worship">🕌<span>العبادة</span></button>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">إضافة</h3>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button id="modalCancel">إلغاء</button>
      <button id="modalSave" class="btn-primary">حفظ</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="dialog.js"></script>
<script src="event.js"></script>
<script src="scheduler.js"></script>
<script src="intelligence.js"></script>
<script src="journal.js"></script>
<script src="pulse.js"></script>
<script src="moment.js"></script>
<script src="fingerprint.js"></script>
<script src="notifications.js"></script>
<script src="appmint-guard.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="native-notifications.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW:", err));
  });
}
</script>
</body>
</html>
