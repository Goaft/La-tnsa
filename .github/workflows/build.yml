name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp style.css www/ || true
          cp *.js www/ || true
          cp manifest.json www/ || true
          cp icon-*.png www/ || true

      - name: Add Android Platform
        run: npx cap add android

      - name: Copy Web Assets
        run: npx cap copy android

      - name: Inject Strict Permissions
        run: |
          # حقن صلاحية المنبه الدقيق (Exact Alarm) التي تجبر النظام على إصدار الإشعار
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk